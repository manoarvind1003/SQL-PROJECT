<!DOCTYPE html>
<html>

<head>

    <title>Zwiggy Signup</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="icon" type="image/png" href="/static/zwiggy_logo.png">

</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>

        <form method="POST">

            <input type="text"
                   name="user_name"
                   placeholder="Username"
                   required>

            <br><br>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <br><br>

            <button type="submit">
                Signup
            </button>

        </form>

        <br>

        <a href="/login">
            Already have an account?
        </a>

    </div>

</body>

</html>
