<!DOCTYPE html>
<html>

<head>
    <title>Zwiggy Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="icon" type="image/png" href="/static/zwiggy_logo.png">

</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>Zwiggy Login</h1>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/signup">
            Create Account
        </a>

    </div>

</body>

</html>
